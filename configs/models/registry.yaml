schema_version: 1
models:
  - id: mock-plate-v1
    display_name: Deterministic mock plate detector
    adapter: deterministic_mock
    model_version: "1.0.0"
    adapter_version: "1.0.0"
    enabled: true
    deployment_allowed: true
    research_only: false
    supported_classes:
      - license_plate
    thresholds:
      confidence: 0.99
      nms_iou: 0.40
      min_size_pixels: 24
    weights:
      source: none
      path: null
      sha256: null
    license:
      spdx_id: LicenseRef-ClearFrame-Project
      name: ClearFrame project code; no model weights
      url: null

  - id: opencv-haar-face
    display_name: OpenCV frontal face Haar cascade
    adapter: opencv_cascade
    model_version: "opencv-4.x-haarcascade_frontalface_default"
    adapter_version: "1.0.0"
    enabled: false
    deployment_allowed: true
    research_only: false
    supported_classes:
      - face
    thresholds:
      confidence: 0.50
      nms_iou: 0.35
      min_size_pixels: 24
    weights:
      source: opencv_data
      path: haarcascade_frontalface_default.xml
      sha256: null
    license:
      spdx_id: Apache-2.0
      name: Apache License 2.0
      url: https://github.com/opencv/opencv/blob/4.x/LICENSE

  - id: opencv-haar-russian-plate
    display_name: OpenCV Russian plate Haar cascade
    adapter: opencv_cascade
    model_version: "opencv-4.x-haarcascade_russian_plate_number"
    adapter_version: "1.0.0"
    enabled: false
    deployment_allowed: true
    research_only: false
    supported_classes:
      - license_plate
    thresholds:
      confidence: 0.50
      nms_iou: 0.40
      min_size_pixels: 24
    weights:
      source: opencv_data
      path: haarcascade_russian_plate_number.xml
      sha256: null
    license:
      spdx_id: Apache-2.0
      name: Apache License 2.0
      url: https://github.com/opencv/opencv/blob/4.x/LICENSE

  - id: yunet-face-local
    display_name: YuNet face detector local slot
    adapter: opencv_yunet
    model_version: unconfigured
    adapter_version: "1.0.0"
    enabled: false
    deployment_allowed: false
    research_only: true
    supported_classes:
      - face
    thresholds:
      confidence: 0.90
      nms_iou: 0.30
      min_size_pixels: 20
    weights:
      source: local
      path: null
      sha256: null
    license: null

  - id: onnx-plate-local
    display_name: ONNX plate detector local slot
    adapter: onnx
    model_version: unconfigured
    adapter_version: "1.0.0"
    enabled: false
    deployment_allowed: false
    research_only: true
    supported_classes:
      - license_plate
    thresholds:
      confidence: 0.50
      nms_iou: 0.45
      min_size_pixels: 16
    weights:
      source: local
      path: null
      sha256: null
    license: null
