schema_version: 1
models:
  - id: yolov9t-plate
    display_name: YOLOv9-s licence plate detector
    adapter: onnxruntime_yolov9
    model_version: "open-image-models-608-end2end"
    adapter_version: "1.0.0"
    enabled: true
    deployment_allowed: true
    research_only: false
    supported_classes:
      - license_plate
    thresholds:
      # Small plates flicker below the spawn threshold for a frame or two.
      # Detections between tracking_confidence and confidence keep an existing
      # track alive without creating new ones.
      confidence: 0.30
      tracking_confidence: 0.10
      nms_iou: 0.45
      min_size_pixels: 8
      # Measured on bodycam footage: real plates run 1.6-2.6:1 in pixels while
      # burned-in camera overlays run 4.3-6.9:1, so 3.5 separates them with
      # margin on both sides.
      max_aspect_ratio: 3.5
    weights:
      source: local
      path: weights/license_plate_detection_yolov9s_608.onnx
      sha256: 2b878b38d9aa07b6ddc3ea75c4ffcb39869bc5c218e0a14002f60ab2f7b0be9a
    license:
      spdx_id: MIT
      name: MIT License
      url: https://github.com/ankandrew/open-image-models/blob/main/LICENSE

  - id: yunet-face
    display_name: OpenCV YuNet face detector
    adapter: onnxruntime_yunet
    model_version: "2023mar-3cc26e7f"
    adapter_version: "1.0.0"
    enabled: true
    deployment_allowed: true
    research_only: false
    supported_classes:
      - face
    thresholds:
      confidence: 0.60
      nms_iou: 0.30
      min_size_pixels: 16
    weights:
      source: local
      path: weights/face_detection_yunet_2023mar.onnx
      sha256: 8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4
    license:
      spdx_id: MIT
      name: MIT License
      url: https://huggingface.co/opencv/face_detection_yunet/blob/3cc26e7f1014a5ee5d74a42acee58bafc9d0a310/LICENSE
