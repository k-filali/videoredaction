name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.cpu.lock
      - run: python -m pip install -r requirements.cpu.lock
      - run: python -m ruff check apps/api/src tests scripts
      - run: python -m mypy apps/api/src tests scripts
      - run: python -m pytest --cov=clearframe --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:web
      - run: pnpm typecheck:web
      - run: pnpm test:web
      - run: pnpm build:web

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLEARFRAME_ACCESS_TOKEN: ci-smoke-only
    steps:
      - uses: actions/checkout@v6
      - run: docker compose -f compose.yaml -f compose.cpu.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.cpu.yaml build
      - run: docker compose -f compose.yaml -f compose.cpu.yaml up --detach --wait --wait-timeout 120
      - run: curl --fail --silent --show-error http://127.0.0.1:5173/api/ready
      - if: always()
        run: docker compose -f compose.yaml -f compose.cpu.yaml down --volumes
