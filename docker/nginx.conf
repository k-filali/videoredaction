map $http_x_forwarded_proto $clearframe_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    client_max_body_size 2m;

    location = /api/videos {
        client_max_body_size 2050m;
        client_body_timeout 1h;
        proxy_pass ${CLEARFRAME_API_URL};
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $clearframe_forwarded_proto;
        proxy_set_header X-Access-Token "${CLEARFRAME_ACCESS_TOKEN}";
        proxy_request_buffering off;
    }

    location /api/ {
        proxy_pass ${CLEARFRAME_API_URL};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $clearframe_forwarded_proto;
        proxy_set_header X-Access-Token "${CLEARFRAME_ACCESS_TOKEN}";
        proxy_request_buffering off;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://storage.googleapis.com; media-src 'self' blob: https://storage.googleapis.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://storage.googleapis.com" always;
    }
}
