[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "clearframe-redaction"
version = "0.1.0"
description = "Human-in-the-loop video redaction research prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "imageio-ffmpeg>=0.6,<1",
  "numpy>=2.2,<3",
  "onnxruntime>=1.28,<2",
  "opencv-python-headless>=4.11,<5",
  "pydantic-settings>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.41,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
clearframe-api = "clearframe.main:run"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/clearframe"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["apps/api/src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps/api/src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["clearframe"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "apps/api/src"
